name: Bug report
description: Report a problem with Void Ledger
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run npm run start:windows
        2. Open /inventory
        3. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Void Ledger version or commit
      placeholder: v0.1.0 or main @ abc1234
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11, Node 20.x
    validations:
      required: true
